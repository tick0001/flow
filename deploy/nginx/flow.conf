# Flow& derriere nginx, hors conteneurs.
#
# nginx sert les fichiers construits de l'interface et relaie /api vers l'API :
# le navigateur ne voit donc **qu'une seule origine**. C'est ce qui permet au
# cookie de session d'etre SameSite=Strict sans rien configurer, et ce qui evite
# d'ouvrir CORS.
#
# A poser dans /etc/nginx/sites-available/flow.conf, puis :
#   sudo ln -s /etc/nginx/sites-available/flow.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Le certificat s'obtient avec certbot : `sudo certbot --nginx -d flow.exemple.fr`.

server {
  listen 80;
  server_name flow.exemple.fr;

  # Tout passe en HTTPS. Le cookie de session est marque `Secure` : sur une
  # installation servie en clair, personne ne pourrait se connecter -- et le
  # symptome serait « la connexion reussit puis me renvoie a la connexion ».
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name flow.exemple.fr;

  ssl_certificate /etc/letsencrypt/live/flow.exemple.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/flow.exemple.fr/privkey.pem;

  root /opt/flow/apps/web/dist;
  index index.html;

  # Une capture d'echec ou une trace Playwright peut peser quelques megaoctets.
  client_max_body_size 32m;

  location /api/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Une execution dure parfois des heures : sans ces delais, nginx couperait
    # le flux d'evenements au bout d'une minute.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # Le flux d'evenements n'est pas un corps a rendre d'un bloc : le tamponner
    # le retiendrait jusqu'a la fin de l'execution, ce qui annule le temps reel.
    proxy_buffering off;
    proxy_cache off;
    gzip off;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    # `index.html` n'est jamais garde : c'est lui qui nomme les fichiers
    # empreintes, et une version en cache ferait servir l'ancienne application
    # apres une montee de version.
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
