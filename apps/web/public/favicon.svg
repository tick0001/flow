<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    La marque : l'esperluette du nom, sur le violet encre de Flow&.
    Un carre presque droit plutot qu'un rond ou un monogramme genere : c'est
    le seul signe qui ne ressemble qu'a Flow&, et il tient a 16 pixels.

    La pile de polices ne nomme que des familles reelles. Un favicon est rendu
    en contexte d'image, ou aucune police du document n'est chargee : les
    familles generiques `ui-sans-serif` et `system-ui` n'y resolvent rien.
  -->
  <rect width="32" height="32" rx="3" fill="#4c3d99" />
  <text
    x="16"
    y="17"
    fill="#fffdf9"
    font-family="Archivo, Helvetica, Arial, sans-serif"
    font-size="23"
    font-weight="700"
    text-anchor="middle"
    dominant-baseline="central"
  >&amp;</text>
</svg>
