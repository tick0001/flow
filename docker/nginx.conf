# L'interface, et le relais vers l'API.
#
# **Une seule origine pour le navigateur.** L'interface et l'API repondent sur le
# meme hote et le meme port : le cookie de session reste `SameSite=Strict` sans
# reglage, et il n'y a pas de CORS a ouvrir -- donc pas d'en-tete permissif a
# oublier de refermer le jour ou l'on ajoute un domaine.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Les reponses de l'API ne sont jamais mises en cache par le relais, et les
  # fichiers de l'interface le sont selon leur nom (voir plus bas).
  proxy_http_version 1.1;

  # Une exécution peut durer des heures. Sans ces delais, nginx couperait le
  # flux d'evenements au bout d'une minute -- et le client, qui se reconnecte,
  # rouvrirait une connexion coupee a son tour, indefiniment.
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;

  # **Le resolveur de Docker, et une adresse en variable.**
  #
  # nginx resout le nom d'un amont **une seule fois**, au chargement de la
  # configuration, et garde l'adresse pour toujours. Or un conteneur redemarre
  # -- une montee de version, une panne, un simple `restart` -- repart avec une
  # autre adresse. Le relais continue alors de parler a une adresse morte, et
  # rend 502 jusqu'a ce que quelqu'un recharge nginx.
  #
  # Passer par une variable force la resolution a chaque requete. Il faut alors
  # nommer le resolveur : 127.0.0.11 est celui que Docker place dans chaque
  # conteneur. Et `$request_uri` devient obligatoire -- avec une variable,
  # nginx ne reecrit plus le chemin lui-meme.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $amont http://api:3100;
    proxy_pass $amont$request_uri;

    proxy_set_header Host $host;
    # L'adresse reelle de l'appelant : l'API la journalise et s'en sert pour
    # limiter les tentatives de connexion. Sans ces en-tetes, toutes les
    # tentatives viendraient de l'adresse du relais, et bloquer une adresse
    # bloquerait tout le monde.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Le flux d'evenements du serveur n'est pas un corps a rendre d'un bloc :
    # tamponner le retiendrait jusqu'a ce qu'il soit plein, c'est-a-dire jusqu'a
    # la fin de l'execution -- ce qui annule tout l'interet du temps reel.
    proxy_buffering off;
    proxy_cache off;
    gzip off;
  }

  # Les fichiers construits portent une empreinte dans leur nom : ils ne
  # changent jamais de contenu, et se gardent un an.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Le reste est une application a page unique : toute adresse inconnue rend
  # `index.html`, et c'est le routeur du navigateur qui decide. Sans cela, un
  # rechargement sur /executions/<id> donnerait un 404 de nginx.
  location / {
    # `index.html` n'est jamais mis en cache : c'est lui qui nomme les fichiers
    # empreintes, et une version gardee ferait servir l'ancienne application
    # apres une montee de version.
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  # Compression du texte. Les images et les polices sont deja compressees ;
  # les repasser couterait du processeur pour rien.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
