# Refus propres a une demonstration publique.
#
# Monte dans `/etc/nginx/flow-extra/` du conteneur `web` par
# `compose.demo.yaml`, et repris par l'`include` de `nginx.conf`. Ce fichier ne
# contient **que** les differences : pas de copie de la configuration de base,
# donc pas de derive possible entre les deux.
#
# Sur une demonstration, les identifiants sont publies : **tout visiteur est
# administrateur**. Quatre capacites deviennent alors dangereuses, et la lecture
# reste ouverte dans les quatre cas -- les ecrans restent visibles, les listes
# s'affichent, seules les ecritures sont refusees.
#
# Le refus est pose ici, dans le relais, plutot que dans l'application. Ce n'est
# pas un choix de confort : une regle nginx ne depend d'aucun droit, d'aucune
# session et d'aucun chemin de code, si bien qu'elle tient meme le jour ou une
# route nouvelle oublie sa garde.

# Le bloc de relais, recopie de `nginx.conf`. Il le faut : un `location` ne
# herite pas du `proxy_pass` d'un autre, et l'omettre rendrait 404 sur les
# lectures qu'on veut justement laisser passer.
#
# `resolver` et la variable sont deja poses par `nginx.conf`, au niveau du
# serveur : ils valent pour tous les blocs.

# 1. Les plugins.
#
# **Le refus le plus important de ce fichier.** Un plugin s'execute dans le
# processus de l'API, avec ses privileges : l'installer revient a deployer du
# code sur la machine. Sur une instance ou n'importe qui est administrateur,
# c'est une execution de code a distance offerte a tout venant.
location ~ ^/api/plugins(/|$) {
    limit_except GET HEAD {
        deny all;
    }
    set $amont_plugins http://api:3100;
    proxy_pass $amont_plugins$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2. Les regles de mise a disposition des bots.
#
# Elles decident quels bots sont proposes, et ou. Les laisser ouvertes
# permettrait a un visiteur de fermer le catalogue pour tous les suivants --
# jusqu'a la remise a zero, la demonstration ne montrerait plus rien.
location ~ ^/api/bots/regles(/|$) {
    limit_except GET HEAD {
        deny all;
    }
    set $amont_regles http://api:3100;
    proxy_pass $amont_regles$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 3. Les regles d'annuaire.
#
# Une regle d'annuaire est une **elevation de privileges differee** : elle dit
# qu'un groupe recevra un profil sur une entite, et s'appliquera a la prochaine
# connexion de quelqu'un qu'on ne connait pas encore. Le plugin d'annuaire se
# configure par ailleurs avec un hote et un port libres, ce qui en fait une
# requete sortante arbitraire depuis le reseau de la machine.
location ~ ^/api/directory(/|$) {
    limit_except GET HEAD {
        deny all;
    }
    set $amont_annuaire http://api:3100;
    proxy_pass $amont_annuaire$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 4. Les clefs d'API.
#
# Une clef emise survit a la remise a zero du navigateur de celui qui l'a creee,
# et permet de declencher des executions sans passer par l'ecran -- donc sans
# les limites que l'interface impose. La remise a zero horaire la supprime, mais
# une heure suffit a s'en servir.
location ~ ^/api/apikeys(/|$) {
    limit_except GET HEAD {
        deny all;
    }
    set $amont_clefs http://api:3100;
    proxy_pass $amont_clefs$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Ce qui reste **volontairement ouvert**, et pourquoi :
#
#   - **lancer un bot.** C'est ce qu'on vient voir. Les quatre bots livres n'ont
#     que des parametres fermes -- aucune adresse a saisir --, si bien qu'un
#     visiteur ne peut faire visiter au serveur que ce que leurs auteurs ont
#     prevu. C'est la raison d'etre de cette contrainte ;
#   - **creer une entite, un compte, un profil.** Sans ecriture, la
#     demonstration se reduirait a un jeu de captures d'ecran ;
#   - **creer une planification.** Elle ne survit pas a l'heure.
