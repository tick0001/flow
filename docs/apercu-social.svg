<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Flow& — automatisation navigateur">
  <title>Flow&amp;</title>

  <!--
    L'image de previsualisation sociale, aux couleurs de l'application.

    Ecrite a la main plutot que dessinee : elle n'a que du texte, deux filets et
    un carre, et un fichier de quelques lignes se relit et se corrige -- la ou un
    export d'outil graphique se reprend entierement.

    1280x640 : le format que GitHub, Slack et les cartes Open Graph attendent.
    La marge est large, parce que ces plateformes recadrent les bords.

    Aucune ombre floue, des filets d'un pixel, des rayons de deux a trois
    pixels : ce sont les regles de la collection, et une image de couverture qui
    ne les suivrait pas annoncerait autre chose que le produit.
  -->

  <rect width="1280" height="640" fill="#f7f4ee" />

  <!-- Le bandeau de gauche, en violet encre : la seule surface pleine. -->
  <rect x="0" y="0" width="14" height="640" fill="#4c3d99" />

  <g transform="translate(96, 132)">
    <!-- La marque : le carre esperluette de l'interface, a l'echelle. -->
    <rect width="72" height="72" rx="3" fill="#4c3d99" />
    <text
      x="36"
      y="53"
      text-anchor="middle"
      font-family="Archivo, 'Segoe UI', ui-sans-serif, system-ui, sans-serif"
      font-size="46"
      font-weight="700"
      fill="#fffdf9"
    >&amp;</text>

    <text
      x="96"
      y="34"
      font-family="Archivo, 'Segoe UI', ui-sans-serif, system-ui, sans-serif"
      font-size="40"
      font-weight="700"
      letter-spacing="-0.5"
      fill="#14120f"
    >Flow&amp;</text>
    <text
      x="96"
      y="62"
      font-family="Archivo, 'Segoe UI', ui-sans-serif, system-ui, sans-serif"
      font-size="18"
      fill="#5c564c"
    >Automatisation navigateur</text>
  </g>

  <text
    x="96"
    y="316"
    font-family="Archivo, 'Segoe UI', ui-sans-serif, system-ui, sans-serif"
    font-size="62"
    font-weight="700"
    letter-spacing="-1.5"
    fill="#14120f"
  >Les bots travaillent,</text>
  <text
    x="96"
    y="388"
    font-family="Archivo, 'Segoe UI', ui-sans-serif, system-ui, sans-serif"
    font-size="62"
    font-weight="700"
    letter-spacing="-1.5"
    fill="#4c3d99"
  >vous regardez.</text>

  <text
    x="96"
    y="442"
    font-family="Archivo, 'Segoe UI', ui-sans-serif, system-ui, sans-serif"
    font-size="21"
    fill="#5c564c"
  >Des bots écrits en TypeScript, exécutés pour toute une organisation,</text>
  <text
    x="96"
    y="472"
    font-family="Archivo, 'Segoe UI', ui-sans-serif, system-ui, sans-serif"
    font-size="21"
    fill="#5c564c"
  >avec le journal et la vue en direct de ce qu’ils font.</text>

  <!-- Un filet, pas une ombre. -->
  <line x1="96" y1="530" x2="1184" y2="530" stroke="#e2dbcf" stroke-width="1" />

  <text
    x="96"
    y="566"
    font-family="ui-monospace, 'Cascadia Code', 'Consolas', monospace"
    font-size="17"
    fill="#8b8274"
  >AGPL-3.0-or-later · tick&amp;</text>

  <!-- Les trois etats d'une execution, en pastilles : le seul endroit ou le
       vert et le rouge apparaissent, et ils disent quelque chose. -->
  <g transform="translate(860, 560)">
    <circle cx="0" cy="0" r="5" fill="#2f7a4d" />
    <text
      x="16"
      y="5"
      font-family="Archivo, 'Segoe UI', ui-sans-serif, system-ui, sans-serif"
      font-size="16"
      fill="#5c564c"
    >Réussie</text>
    <circle cx="110" cy="0" r="5" fill="#b0730b" />
    <text
      x="126"
      y="5"
      font-family="Archivo, 'Segoe UI', ui-sans-serif, system-ui, sans-serif"
      font-size="16"
      fill="#5c564c"
    >En cours</text>
    <circle cx="222" cy="0" r="5" fill="#9b1c1c" />
    <text
      x="238"
      y="5"
      font-family="Archivo, 'Segoe UI', ui-sans-serif, system-ui, sans-serif"
      font-size="16"
      fill="#5c564c"
    >Échec</text>
  </g>
</svg>
