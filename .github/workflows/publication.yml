name: Publication

# Les images, publiees sur ghcr.io a chaque etiquette de version.
#
# **Sur une etiquette, jamais sur une branche.** Une image construite a chaque
# fusion donnerait un `latest` qui bouge sous les installations qui le suivent,
# et une montee de version deviendrait quelque chose qui arrive plutot que
# quelque chose qu'on decide.
#
# L'etiquette porte la version : `v0.1.0` publie `0.1.0`, et met a jour `latest`
# quand elle n'est pas une pre-version.
on:
  push:
    tags: ['v*']
  # Le declenchement a la main sert aux essais : il construit sans publier.
  workflow_dispatch:

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Ecrire dans le registre de paquets de l'organisation. Rien d'autre.
  packages: write

jobs:
  images:
    name: Image ${{ matrix.cible }}
    runs-on: ubuntu-latest

    strategy:
      # Une image qui echoue ne doit pas annuler les trois autres : savoir
      # laquelle casse vaut mieux que trois travaux annules.
      fail-fast: false
      matrix:
        cible: [api, worker, web, migrations]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Connexion au registre
        # Pas de connexion sur un declenchement manuel : il ne publie pas, et
        # demander un jeton pour rien est une habitude a ne pas prendre.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquettes
        id: etiquettes
        uses: docker/metadata-action@v5
        with:
          # L'organisation vient du depot lui-meme : l'ecrire en dur donnerait
          # une adresse fausse le jour ou le depot change de maison.
          images: ghcr.io/${{ github.repository_owner }}/flow-${{ matrix.cible }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Construction
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.cible }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.etiquettes.outputs.tags }}
          labels: ${{ steps.etiquettes.outputs.labels }}
          # Le cache d'un travail a l'autre : les quatre images partagent leur
          # etape de construction, et sans cache chacune la referait.
          cache-from: type=gha,scope=flow-${{ matrix.cible }}
          cache-to: type=gha,scope=flow-${{ matrix.cible }},mode=max
          provenance: false
