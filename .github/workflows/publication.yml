name: Publication

# Publier une version, en fusionnant `release/<version>` dans `main`.
#
# Le numero de version est porte par le **nom de la branche**, et nulle part
# ailleurs : c'est ce qui permet a une pull request de dire ce qu'elle publie
# avant d'etre fusionnee, et a toute autre -- un correctif de securite de
# Dependabot, une retouche de documentation -- d'atteindre `main` sans rien
# publier du tout.
#
# Ce workflow n'empaquette rien lui-meme. Il verifie, etiquette, puis appelle
# « Images » et « Archives ». L'appel plutot que l'etiquette : une etiquette
# poussee par un workflow ne declenche aucun autre workflow, GitHub l'interdit
# pour eviter les recursions. Publier depuis une fusion exigerait sinon un jeton
# personnel, c'est-a-dire un secret de plus a faire tourner et a revoquer.

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  etiqueter:
    name: Etiquette
    runs-on: ubuntu-latest

    # Fermee n'est pas fusionnee : une pull request abandonnee passe par le meme
    # evenement, et ne publie rien.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')

    permissions:
      # Creer l'etiquette, rien d'autre. Le workflow ne peut pas modifier une
      # branche, protegee ou non.
      contents: write

    outputs:
      etiquette: ${{ steps.version.outputs.etiquette }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Le commit de fusion reellement pose sur `main`, et non la fusion
          # d'essai que `github.sha` designe pendant une pull request.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Numero de version
        id: version
        env:
          BRANCHE: ${{ github.event.pull_request.head.ref }}
        run: |
          numero="${BRANCHE#release/}"

          # Un nom de branche est libre : rien n'empeche `release/prochaine`.
          # Refuser tot vaut mieux qu'etiqueter `vprochaine`.
          if ! printf '%s' "$numero" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::« $numero » n'est pas un numero de version. Nommez la branche release/0.1.1."
            exit 1
          fi

          echo "numero=$numero" >> "$GITHUB_OUTPUT"
          echo "etiquette=v$numero" >> "$GITHUB_OUTPUT"

      # Le manifeste est la source que lit `/api/health`. S'il diverge du nom de
      # la branche, l'installation annoncera une version qui n'est pas la
      # sienne -- le defaut meme que cette lecture remplace.
      - name: Concordance avec le manifeste
        env:
          ATTENDUE: ${{ steps.version.outputs.numero }}
        run: |
          manifeste=$(node -p "require('./apps/api/package.json').version")
          if [ "$manifeste" != "$ATTENDUE" ]; then
            echo "::error::La branche annonce $ATTENDUE, le manifeste apps/api/package.json dit $manifeste."
            exit 1
          fi

      # Reetiqueter en silence ferait pointer une version publiee vers un autre
      # code : les images et les archives deja distribuees ne changeraient pas,
      # et l'etiquette mentirait sur ce qu'elles contiennent.
      - name: Etiquette encore libre
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ETIQUETTE: ${{ steps.version.outputs.etiquette }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$ETIQUETTE" >/dev/null 2>&1; then
            echo "::error::$ETIQUETTE existe deja. Une version publiee ne se deplace pas : montez le numero."
            exit 1
          fi

      - name: Poser l'etiquette
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ETIQUETTE: ${{ steps.version.outputs.etiquette }}
          COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh api -X POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$ETIQUETTE" \
            -f sha="$COMMIT" >/dev/null
          echo "$ETIQUETTE posee sur $COMMIT."

  images:
    name: Images
    needs: etiqueter
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      etiquette: ${{ needs.etiqueter.outputs.etiquette }}

  archives:
    name: Archives
    needs: etiqueter
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      etiquette: ${{ needs.etiqueter.outputs.etiquette }}
